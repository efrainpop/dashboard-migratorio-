name: Actualizador Automatizado del Dashboard

on:
  schedule:
    # Se ejecuta automáticamente todos los lunes a las 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Permite ejecutar la actualización manualmente con un botón cuando quieras

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script de actualización
        run: python update_dashboard.py

      - name: Enviar cambios a GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-actualización de datos migratorios" || exit 0
          git push
